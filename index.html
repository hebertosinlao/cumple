<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cumpleaños de León y Ramses</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Work+Sans:wght@400;500;600;700&display=swap');

  :root{
    --paper:#FFFFFF;
    --ink:#111111;
    --muted:#6E6E6E;
    --line:#E7E5E1;
    --pink:#EC1F86;
    --orange:#FF6A00;
    --green:#22C55E;
    --purple:#8B33F7;
    --amber:#FFC300;
    --sky:#00B8D9;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:'Work Sans', sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:70px;
  }
  h1,h2,h3{
    font-family:'Space Grotesk', sans-serif;
    margin:0;
  }
  a{color:inherit;}

  header.top{
    padding:16px 18px 0;
  }
  .masthead-bar{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding-bottom:12px;
    border-bottom:1px solid var(--ink);
    font-size:11px;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:var(--muted);
    flex-wrap:wrap;
    gap:8px;
  }
  header.top h1{
    font-size:38px;
    line-height:0.95;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:-0.01em;
    margin:20px 0 0;
  }
  header.top p{
    margin:10px 0 18px;
    font-size:14px;
    color:var(--muted);
    max-width:40ch;
    line-height:1.5;
  }
  .who{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .who label{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);}

  select, input[type=text], input[type=number], input[type=date], input[type=time]{
    font-family:'Work Sans', sans-serif;
    font-size:14px;
    padding:8px 10px;
    border:1px solid var(--ink);
    border-radius:0;
    background:var(--paper);
    color:var(--ink);
  }
  select:focus, input:focus{ outline:none; }

  .tabs{
    display:flex;
    gap:10px;
    padding:14px 18px;
    border-bottom:1px solid var(--ink);
    position:sticky;
    top:0;
    background:var(--paper);
    z-index:10;
    overflow-x:auto;
  }
  .tab{
    padding:8px 14px;
    font-size:12px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    cursor:pointer;
    color:var(--ink);
    border:1px solid var(--ink);
    white-space:nowrap;
  }
  .tab:nth-child(1).active{ background:var(--pink); color:#fff; border-color:var(--pink); }
  .tab:nth-child(2).active{ background:var(--orange); color:#fff; border-color:var(--orange); }
  .tab:nth-child(3).active{ background:var(--sky); color:#fff; border-color:var(--sky); }
  .tab:nth-child(4).active{ background:var(--purple); color:#fff; border-color:var(--purple); }
  .tab:nth-child(5).active{ background:var(--amber); color:#111; border-color:var(--amber); }
  .tab:nth-child(6).active{ background:var(--green); color:#fff; border-color:var(--green); }

  main{padding:22px 18px 8px;max-width:640px;margin:0 auto;}

  .day-divider{
    display:flex;
    align-items:baseline;
    justify-content:space-between;
    margin:38px 0 16px;
    padding-bottom:8px;
    border-bottom:2px solid var(--ink);
  }
  .day-divider:first-child{margin-top:0;}
  .day-divider h2{
    font-size:15px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .day-divider span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;}

  .card{
    margin-bottom:34px;
  }
  .cover{
    width:100%;
    aspect-ratio:4/3;
    display:flex;
    align-items:flex-end;
    padding:16px;
    color:#fff;
    position:relative;
    overflow:hidden;
  }
  .cover .cover-name{
    font-family:'Space Grotesk', sans-serif;
    font-weight:700;
    font-size:26px;
    line-height:1.02;
    text-transform:uppercase;
    max-width:90%;
  }
  .cover .cover-time{
    position:absolute;
    top:14px;
    left:16px;
    font-size:11px;
    font-weight:600;
    letter-spacing:.08em;
    text-transform:uppercase;
    background:rgba(0,0,0,.28);
    padding:4px 9px;
  }
  .event-chip-toggle{
    display:block;
    width:100%;
    text-align:left;
    padding:12px 16px;
    font-size:14px;
    font-weight:700;
    letter-spacing:.05em;
    text-transform:uppercase;
    font-family:'Space Grotesk', sans-serif;
    border:1.5px solid var(--ink);
    cursor:pointer;
    transition:background .15s, color .15s, border-color .15s;
  }
  .event-chip{
    display:inline-block;
    padding:8px 14px;
    font-size:12px;
    font-weight:700;
    letter-spacing:.06em;
    text-transform:uppercase;
    color:#fff;
    font-family:'Space Grotesk', sans-serif;
  }
  .event-body{padding:14px 2px 0;}
  .event-body h3{font-size:19px;font-weight:700;text-transform:uppercase;letter-spacing:-.01em;}
  .event-meta{font-size:12px;color:var(--muted);margin-top:6px;text-transform:uppercase;letter-spacing:.04em;}
  .event-notes{font-size:14px;color:var(--ink);margin-top:8px;line-height:1.5;}

  .arrow-link{
    display:inline-block;
    font-family:'Work Sans', sans-serif;
    font-weight:700;
    font-size:12px;
    letter-spacing:.04em;
    text-transform:uppercase;
    cursor:pointer;
    border:none;
    background:none;
    color:var(--ink);
    padding:0;
  }
  .arrow-link:after{content:" »";}

  .rsvp-btn{
    font-family:'Work Sans', sans-serif;
    font-weight:700;
    font-size:12px;
    letter-spacing:.04em;
    text-transform:uppercase;
    padding:9px 16px;
    border:1px solid var(--ink);
    background:var(--paper);
    color:var(--ink);
    cursor:pointer;
    white-space:nowrap;
  }
  .rsvp-btn.going{ background:var(--green); color:#fff; border-color:var(--green); }
  .rsvp-btn:disabled{opacity:.35;cursor:default;}

  .attend-row{display:flex;align-items:center;gap:12px;margin-top:14px;flex-wrap:wrap;}
  .avatar-stack{display:flex;padding-left:8px;}
  .avatar-chip{
    width:28px;height:28px;border-radius:50%;
    display:inline-flex;align-items:center;justify-content:center;
    font-size:11px;font-weight:700;color:#fff;
    margin-left:-8px;border:2px solid var(--paper);
    font-family:'Space Grotesk', sans-serif;
  }
  .attend-count{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;}

  .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center;justify-content:space-between;}
  .row-start{display:flex;gap:14px;flex-wrap:wrap;align-items:center;}

  .btn{
    font-family:'Work Sans', sans-serif;
    font-weight:700;
    font-size:13px;
    letter-spacing:.03em;
    text-transform:uppercase;
    padding:11px 18px;
    border:1px solid var(--ink);
    background:var(--ink);
    color:#fff;
    cursor:pointer;
  }
  .btn.secondary{background:var(--paper);color:var(--ink);}
  .btn.small{padding:7px 13px;font-size:11px;}

  .section-title{
    font-size:12px;
    margin-bottom:18px;
    font-weight:700;
    text-transform:uppercase;
    letter-spacing:.06em;
    color:var(--muted);
    border-bottom:1px solid var(--ink);
    padding-bottom:10px;
  }
  .form-grid{display:grid;gap:12px;margin-bottom:10px;}
  .form-grid.two{grid-template-columns:1fr 1fr;}
  .add-card{border-top:2px dashed var(--line);padding-top:24px;margin-top:6px;}

  .empty{color:var(--muted);font-size:14px;padding:30px 0;text-align:center;}

  .expense-row{
    display:flex;justify-content:space-between;align-items:center;
    padding:12px 0;border-bottom:1px solid var(--line);font-size:14px;gap:8px;
  }
  .expense-row:last-child{border-bottom:none;}
  .expense-amt{font-weight:700;white-space:nowrap;font-family:'Space Grotesk', sans-serif;}
  .split-tags{font-size:12px;color:var(--muted);margin-top:2px;text-transform:uppercase;letter-spacing:.03em;}

  .event-summary{
    display:flex;justify-content:space-between;align-items:baseline;
    border-bottom:2px solid var(--ink);padding-bottom:10px;margin-bottom:4px;
  }
  .event-summary h3{font-size:16px;font-weight:700;text-transform:uppercase;}

  .balance-hero{
    background:var(--ink);
    color:#fff;
    padding:26px 20px;
    margin-bottom:34px;
  }
  .balance-hero .kicker{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:#B9B9B9;margin-bottom:14px;}
  .balance-row{
    display:flex;justify-content:space-between;align-items:baseline;
    font-size:15px;padding:9px 0;border-bottom:1px solid #3A3A3A;
  }
  .balance-row:last-of-type{border-bottom:none;}
  .balance-row .amt{font-family:'Space Grotesk', sans-serif;font-weight:700;font-size:19px;}
  .balance-row .amt.pos{color:#4ADE80;}
  .balance-row .amt.neg{color:#FF7FAE;}
  .settle-line{
    font-size:12px;color:#C9C9C9;padding:14px 0 0;margin-top:12px;
    border-top:1px solid #3A3A3A;line-height:1.9;text-transform:uppercase;letter-spacing:.03em;
  }

  .guest-list{list-style:none;padding:0;margin:0;}
  .guest-list li{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 0;border-bottom:1px solid var(--line);font-size:15px;
  }
  .guest-list li:last-child{border-bottom:none;}

  .lodging-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:10px;}
  .lodging-fields label{font-size:11px;color:var(--muted);display:block;margin-bottom:5px;text-transform:uppercase;letter-spacing:.04em;}

  .icon-btn{background:none;border:none;color:var(--muted);font-size:16px;cursor:pointer;padding:2px 6px;}
  .icon-btn:hover{color:var(--pink);}

  .checkbox-list{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px;}
  .checkbox-list label{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);}

  details summary{list-style:none;cursor:pointer;}
  details summary::-webkit-details-marker{display:none;}

  .toast{
    position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
    background:var(--ink);color:#fff;padding:10px 18px;font-size:13px;
    opacity:0;pointer-events:none;transition:opacity .25s;
  }
  .toast.show{opacity:1;}
  .loading{padding:60px 20px;text-align:center;color:var(--muted);}
</style>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body>

<header class="top">
  <div class="masthead-bar">
    <span>Guía del cumple · privada</span>
    <div class="who">
      <label for="whoSelect">Viendo como</label>
      <select id="whoSelect"></select>
    </div>
  </div>
  <h1>Cumpleaños<br>de León y Ramses</h1>
  <p>Eventos, puntos de reunión, invitados y gastos — todo en un mismo lugar, compartido con el grupo.</p>
</header>

<div class="tabs">
  <div class="tab active" data-tab="eventos">Eventos</div>
  <div class="tab" data-tab="puntos">Puntos de reunión</div>
  <div class="tab" data-tab="mapa">Mapa</div>
  <div class="tab" data-tab="invitados">Invitados</div>
  <div class="tab" data-tab="gastos">Gastos</div>
  <div class="tab" data-tab="enlaces">Enlaces</div>
</div>

<main id="app">
  <div class="loading">Cargando...</div>
</main>

<div class="toast" id="toast"></div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-app.js";
import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.13.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA7Xqzvyxgaons2qETN4bUIhMtfGkuuVYM",
  authDomain: "cumple-aa5b1.firebaseapp.com",
  projectId: "cumple-aa5b1",
  storageBucket: "cumple-aa5b1.firebasestorage.app",
  messagingSenderId: "148377768935",
  appId: "1:148377768935:web:efd2f0bc783319c9c02342"
};
const fbApp = initializeApp(firebaseConfig);
const db = getFirestore(fbApp);
const docRef = doc(db, 'cumple', 'data');

let state = { events: [], meetingPoints: [], guests: [], rsvps: {}, expenses: [], lodging: {}, links: {} };
let myGuestId = null;
let activeTab = 'eventos';
let editingItem = { events: null, meetingPoints: null, guest: null };
let expandedIds = new Set();
let mapCounter = 0;
let suppressRender = false;
let pendingRender = false;
let generalMapInstance = null;
let generalLayerGroups = { eventos: null, puntos: null, invitados: null };
const AVATAR_COLORS = ['#E63946','#F3722C','#43AA8B','#277DA1','#9D4EDD','#F72585','#4361EE','#06A77D'];
const EVENT_COLORS = [
  {bg:'#FF4D4D', fg:'#fff'},
  {bg:'#FF9F1C', fg:'#111'},
  {bg:'#FFD60A', fg:'#111'},
  {bg:'#2ECC71', fg:'#fff'},
  {bg:'#06D6A0', fg:'#111'},
  {bg:'#4CC9F0', fg:'#111'},
  {bg:'#7B61FF', fg:'#fff'},
  {bg:'#FF5DA2', fg:'#fff'}
];

const SECTION_META = {
  events: {
    label: 'evento',
    addTitle: 'Agregar evento',
    addBtn: 'Agregar evento',
    emptyMsg: 'Aún no hay eventos. Agrega el primero abajo.'
  },
  meetingPoints: {
    label: 'punto de reunión',
    addTitle: 'Agregar punto de reunión',
    addBtn: 'Agregar punto de reunión',
    emptyMsg: 'Aún no hay puntos de reunión. Agrega el primero abajo.'
  }
};

const ICON_INSTAGRAM = `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#D62976" stroke-width="2" style="vertical-align:-3px;flex-shrink:0;"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="5"/><circle cx="17.5" cy="6.5" r="1.1" fill="#D62976" stroke="none"/></svg>`;
const ICON_WHATSAPP = `<svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" style="flex-shrink:0;"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.39 1.26 4.82L2 22l5.41-1.42a9.87 9.87 0 0 0 4.63 1.18h.01c5.46 0 9.91-4.45 9.91-9.91C21.96 6.45 17.51 2 12.04 2zm0 18.02h-.01a8.1 8.1 0 0 1-4.14-1.13l-.3-.18-3.08.81.82-3-.19-.31a8.11 8.11 0 0 1-1.24-4.3c0-4.49 3.65-8.14 8.15-8.14 2.18 0 4.22.85 5.76 2.39a8.09 8.09 0 0 1 2.39 5.76c0 4.49-3.66 8.1-8.16 8.1zm4.47-6.1c-.24-.12-1.44-.71-1.66-.79-.22-.08-.39-.12-.55.12-.16.24-.63.79-.78.95-.14.16-.29.18-.53.06-.24-.12-1.02-.38-1.94-1.2-.72-.64-1.2-1.44-1.34-1.68-.14-.24-.02-.37.11-.49.11-.11.24-.29.36-.43.12-.14.16-.24.24-.4.08-.16.04-.3-.02-.42-.06-.12-.55-1.32-.75-1.81-.2-.48-.4-.41-.55-.42h-.47c-.16 0-.42.06-.64.3-.22.24-.84.82-.84 2s.86 2.32.98 2.48c.12.16 1.7 2.6 4.12 3.65.58.25 1.03.4 1.38.51.58.18 1.11.16 1.53.1.47-.07 1.44-.59 1.64-1.16.2-.57.2-1.06.14-1.16-.06-.1-.22-.16-.46-.28z"/></svg>`;
const ICON_FOLDER = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="flex-shrink:0;"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7z"/></svg>`;

function genId(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
function esc(s){ return (s||'').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function fmtMoney(n){ return '$' + (Math.round(n*100)/100).toLocaleString('es-MX'); }
function avatarColor(id){
  const idx = state.guests.findIndex(g => g.id === id);
  if(idx === -1) return AVATAR_COLORS[0];
  return AVATAR_COLORS[idx % AVATAR_COLORS.length];
}
function initials(name){
  const parts = name.trim().split(/\s+/);
  return ((parts[0]?.[0]||'') + (parts[1]?.[0]||'')).toUpperCase();
}
function assignColors(listKey){
  const days = groupByDay(state[listKey]);
  const dayKeys = Object.keys(days).sort();
  const map = {};
  let idx = 0;
  dayKeys.forEach(day=>{
    days[day].forEach(item=>{
      map[item.id] = EVENT_COLORS[idx % EVENT_COLORS.length];
      idx++;
    });
  });
  return map;
}
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1600);
}

function loadAll(){
  try{ myGuestId = localStorage.getItem('myGuestId') || null; }catch(e){ /* sin soporte de localStorage */ }
  onSnapshot(docRef, (snap)=>{
    if(snap.exists()){
      const d = snap.data();
      state = {
        events: d.events || [],
        meetingPoints: d.meetingPoints || [],
        guests: d.guests || [],
        rsvps: d.rsvps || {},
        expenses: d.expenses || [],
        lodging: d.lodging || {},
        links: d.links || {}
      };
    } else {
      state = { events: [], meetingPoints: [], guests: [], rsvps: {}, expenses: [], lodging: {}, links: {} };
    }
    render();
  }, (err)=>{
    console.error(err);
    showToast('No se pudo conectar con la base de datos.');
  });
}

async function persist(){
  try{
    await setDoc(docRef, state);
  }catch(e){
    showToast('No se pudo guardar. Intenta de nuevo.');
    console.error(e);
  }
}

function setMyGuestId(id){
  myGuestId = id;
  try{ localStorage.setItem('myGuestId', id || ''); }catch(e){ /* sin soporte de localStorage */ }
  render();
}

// ---------- rendering ----------

function render(){
  if(suppressRender){ pendingRender = true; return; }
  renderWhoSelect();
  const app = document.getElementById('app');
  if(activeTab === 'eventos') app.innerHTML = renderEventSection('events');
  else if(activeTab === 'puntos') app.innerHTML = renderEventSection('meetingPoints');
  else if(activeTab === 'mapa') app.innerHTML = renderMapa();
  else if(activeTab === 'invitados') app.innerHTML = renderInvitados();
  else if(activeTab === 'gastos') app.innerHTML = renderGastos();
  else app.innerHTML = renderEnlaces();
  attachHandlers();
  initCroquisMaps();
  initGeneralMap();
}

function renderWhoSelect(){
  const sel = document.getElementById('whoSelect');
  const opts = ['<option value="">Elige tu nombre...</option>']
    .concat(state.guests.map(g => `<option value="${g.id}" ${g.id===myGuestId?'selected':''}>${esc(g.name)}</option>`));
  sel.innerHTML = opts.join('');
}

function groupByDay(items){
  const days = {};
  items.slice().sort((a,b)=> (a.date+a.time).localeCompare(b.date+b.time)).forEach(it=>{
    const key = it.date || 'Sin fecha';
    if(!days[key]) days[key] = [];
    days[key].push(it);
  });
  return days;
}

function renderAttendeeVisual(attendeeIds){
  const total = state.guests.length;
  const avatars = attendeeIds.map(id=>{
    const g = state.guests.find(x=>x.id===id);
    if(!g) return '';
    return `<span class="avatar-chip" style="background:${avatarColor(g.id)}" title="${esc(g.name)}">${esc(initials(g.name))}</span>`;
  }).join('');
  return `
  <div class="attend-row">
    <div class="avatar-stack">${avatars}</div>
    <span class="attend-count">${attendeeIds.length} de ${total} confirmaron</span>
  </div>`;
}

function renderItemCard(listKey, item, color){
  const isOpen = expandedIds.has(item.id);
  let html = `<div class="card">
    <button class="event-chip-toggle" data-action="toggle-expand" data-id="${item.id}" style="${isOpen ? `background:${color.bg};color:${color.fg};border-color:${color.bg};` : `background:var(--paper);color:var(--ink);border-color:var(--ink);`}">${esc(item.name)}</button>`;
  if(isOpen){
    const attendeeIds = state.rsvps[item.id] ? Object.keys(state.rsvps[item.id]).filter(g=>state.rsvps[item.id][g]) : [];
    const iAmGoing = myGuestId && attendeeIds.includes(myGuestId);
    html += `
    <div class="event-body">
      <div style="display:flex;justify-content:flex-end;margin-top:14px;">
        <button class="rsvp-btn ${iAmGoing?'going':''}" data-action="toggle-rsvp" data-event="${item.id}" ${myGuestId?'':'disabled'}>
          ${iAmGoing ? '✓ Voy' : 'Confirmar'}
        </button>
      </div>
      ${item.time ? `<div class="event-meta">${esc(item.time)}</div>` : ''}
      ${item.notes ? `<div class="event-notes">${esc(item.notes)}</div>` : ''}
      ${mapsBlockHtml(item.location, color.bg)}
      ${renderAttendeeVisual(attendeeIds)}
      <div class="row-start" style="margin-top:14px;">
        <button class="arrow-link" data-action="edit-item" data-list="${listKey}" data-id="${item.id}" style="text-transform:none;">Editar</button>

function renderGastos(){
  if(state.events.length === 0){

  }
  const balances = {};
  state.guests.forEach(g => balances[g.id] = 0);
  state.expenses.forEach(ex=>{
    const among = ex.splitAmong.length ? ex.splitAmong : [];
    if(among.length === 0) return;
    const share = ex.amount / among.length;
    if(balances[ex.paidBy] !== undefined) balances[ex.paidBy] += ex.amount;
    among.forEach(gid=>{
      if(balances[gid] !== undefined) balances[gid] -= share;
    });
  });

  let html = `<div class="balance-hero"><div class="kicker">Balance general</div>`;
  state.guests.forEach(g=>{
    const b = balances[g.id] || 0;
    if(Math.abs(b) < 0.5) return;
    html += `<div class="balance-row"><span>${esc(g.name)}</span><span class="amt ${b>0?'pos':'neg'}">${b>0?'le deben '+fmtMoney(b):'debe '+fmtMoney(-b)}</span></div>`;
  });
  if(state.guests.every(g=>Math.abs(balances[g.id]||0)<0.5)){
    html += `<div class="balance-row"><span style="color:#C9C9C9;">Sin gastos registrados todavía.</span></div>`;
  }
  html += settlementSuggestions(balances);
  html += `</div>`;

  html += `<div class="section-title">Gastos por evento</div>`;
  state.events.slice().sort((a,b)=>(a.date+a.time).localeCompare(b.date+b.time)).forEach(ev=>{
    const evExpenses = state.expenses.filter(e=>e.eventId === ev.id);
    const total = evExpenses.reduce((s,e)=>s+e.amount,0);
    const attendeeIds = state.rsvps[ev.id] ? Object.keys(state.rsvps[ev.id]).filter(g=>state.rsvps[ev.id][g]) : [];
    html += `
    <div class="card">
      <div class="event-summary">
        <h3>${esc(ev.name)}</h3>
        <span class="expense-amt">${fmtMoney(total)}</span>
      </div>

        const payer = state.guests.find(g=>g.id===ex.paidBy)?.name || '?';
        const among = ex.splitAmong.map(id=>state.guests.find(g=>g.id===id)?.name).filter(Boolean);
        return `<div class="expense-row">
          <div>
            <div>${esc(ex.desc)}</div>
            <div class="split-tags">Pagó ${esc(payer)} · entre ${among.length} persona${among.length!==1?'s':''}</div>
          </div>
          <div class="row-start">
            <span class="expense-amt">${fmtMoney(ex.amount)}</span>
            <button class="icon-btn" data-action="delete-expense" data-expense="${ex.id}" title="Eliminar">✕</button>
          </div>
        </div>`;
      }).join('') || '<div class="empty" style="padding:10px 0;">Sin gastos en este evento</div>'}
      <details style="margin-top:14px;">
        <summary class="arrow-link">Agregar gasto</summary>
        <div class="form-grid two" style="margin-top:12px;">
          <input type="text" placeholder="Descripción" id="exDesc-${ev.id}">

        </div>

          ${state.guests.map(g=>`<option value="${g.id}">${esc(g.name)}</option>`).join('')}
        </select>
        <div style="font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;">Dividir entre</div>
        <div class="checkbox-list">

        </div>

}

function settlementSuggestions(balances){
  const creditors = [], debtors = [];
  Object.keys(balances).forEach(id=>{
    const b = balances[id];
    if(b > 0.5) creditors.push({id, amt:b});
    else if(b < -0.5) debtors.push({id, amt:-b});
  });
  creditors.sort((a,b)=>b.amt-a.amt);
  debtors.sort((a,b)=>b.amt-a.amt);
  const lines = [];
  let ci=0, di=0;
  while(ci<creditors.length && di<debtors.length){
    const pay = Math.min(creditors[ci].amt, debtors[di].amt);
    const fromName = state.guests.find(g=>g.id===debtors[di].id)?.name || '?';
    const toName = state.guests.find(g=>g.id===creditors[ci].id)?.name || '?';
    lines.push(`${fromName} → ${toName}: ${fmtMoney(pay)}`);
    creditors[ci].amt -= pay;
    debtors[di].amt -= pay;
    if(creditors[ci].amt < 0.5) ci++;
    if(debtors[di].amt < 0.5) di++;
  }
  if(lines.length === 0) return '';
  return `<div class="settle-line">Para saldar cuentas<br>${lines.join('<br>')}</div>`;
}

function looksLikeUrl(s){ return /^https?:\/\//i.test((s||'').trim()); }
function isShortLink(s){ return /goo\.gl\//i.test(s) || /maps\.app\.goo\.gl/i.test(s); }

async function fetchWithTimeout(url, ms){
  const controller = new AbortController();
  const timer = setTimeout(()=>controller.abort(), ms);
  try{
    const res = await fetch(url, { signal: controller.signal });
    return await res.json();
  }finally{
    clearTimeout(timer);
  }
}

async function initCroquisMaps(){
  const els = document.querySelectorAll('.croquis-map:not([data-inited])');
  for(const el of els){

      el.style.background = 'none';
      el.textContent = 'No se pudo cargar el mapa (revisa tu conexión a internet).';
      continue;
    }
    const query = el.dataset.query;
    const color = el.dataset.color;
    const coordMatch = query.match(/^(-?\d+\.\d+),\s*(-?\d+\.\d+)$/);
    if(coordMatch){
      buildLeafletMap(el, parseFloat(coordMatch[1]), parseFloat(coordMatch[2]), color);
      continue;
    }
    try{
      const data = await fetchWithTimeout(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(query)}`, 8000);
      if(data && data[0]){
        buildLeafletMap(el, parseFloat(data[0].lat), parseFloat(data[0].lon), color);
      } else {
        el.style.background = 'none';
        el.textContent = 'No se encontró el lugar para dibujar el mapa.';
      }
    }catch(e){
      el.style.background = 'none';
      el.textContent = 'No se pudo cargar el mapa (revisa tu conexión a internet).';
    }
  }
}

async function initGeneralMap(){
  const el = document.getElementById('generalMap');
  if(!el || el.dataset.inited) return;
  el.dataset.inited = '1';

  if(typeof L === 'undefined'){
    el.style.background = 'none';
    el.textContent = 'No se pudo cargar el mapa (revisa tu conexión a internet).';
    return;
  }

  const eventColors = assignColors('events');
  const meetingColors = assignColors('meetingPoints');

  const eventItems = state.events.filter(it => it.location && it.location.trim())
    .map(it => ({ id: it.id, name: it.name, location: it.location, category: 'eventos', color: eventColors[it.id].bg }));
  const meetingItems = state.meetingPoints.filter(it => it.location && it.location.trim())
    .map(it => ({ id: it.id, name: it.name, location: it.location, category: 'puntos', color: meetingColors[it.id].bg }));
  const guestItems = state.guests
    .map(g => ({ g, l: state.lodging[g.id] || {} }))
    .filter(x => (x.l.mapsLink || '').trim())
    .map(x => ({ id: x.g.id, name: x.g.name, location: x.l.mapsLink, category: 'invitados', color: avatarColor(x.g.id), lodging: x.l }));

  const allItems = [...eventItems, ...meetingItems, ...guestItems];

  if(allItems.length === 0){
    el.style.background = 'none';
    el.textContent = 'Agrega ubicaciones a tus eventos, puntos de reunión o invitados para verlas aquí.';
    return;
  }

  const points = [];
  for(const it of allItems){
    const q = extractMapQuery(it.location);
    if(!q) continue;
    let lat, lng;
    const coordMatch = q.match(/^(-?\d+\.\d+),\s*(-?\d+\.\d+)$/);
    if(coordMatch){
      lat = parseFloat(coordMatch[1]); lng = parseFloat(coordMatch[2]);
    } else {
      try{
        const data = await fetchWithTimeout(`https://nominatim.openstreetmap.org/search?format=json&limit=1&q=${encodeURIComponent(q)}`, 8000);
        if(data && data[0]){ lat = parseFloat(data[0].lat); lng = parseFloat(data[0].lon); }
      }catch(e){ /* se omite este punto */ }
    }
    if(lat !== undefined && lng !== undefined){
      points.push({ ...it, lat, lng });
    }
  }

  if(points.length === 0){
    el.style.background = 'none';
    el.textContent = 'Ninguna de las direcciones cargadas se pudo ubicar en el mapa todavía (revisa que no sean links cortos de Google Maps).';
    return;
  }

  el.textContent = '';
  el.style.background = 'none';
  const map = L.map(el, { zoomControl:false, scrollWheelZoom:false });
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap, © CARTO',
    maxZoom: 19,
    subdomains: 'abcd'
  }).addTo(map);

  const layerGroups = { eventos: L.layerGroup(), puntos: L.layerGroup(), invitados: L.layerGroup() };
  const bounds = [];
  points.forEach(p=>{
    const icon = L.divIcon({
      className: 'croquis-pin',
      html: `<div style="width:14px;height:14px;border-radius:50%;background:${p.color};border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35);"></div>`,
      iconSize: [14,14],
      iconAnchor: [7,7]
    });
    let popupHtml;
    if(p.category === 'invitados'){
      popupHtml = popupGuestHtml(p.name, p.lodging || {});
    } else {
      const attendeeIds = state.rsvps[p.id] ? Object.keys(state.rsvps[p.id]).filter(g=>state.rsvps[p.id][g]) : [];
      popupHtml = `
        <div style="font-family:'Work Sans',sans-serif;min-width:170px;">
          <strong style="font-family:'Space Grotesk',sans-serif;text-transform:uppercase;font-size:13px;">${esc(p.name)}</strong>
          ${popupAttendeesHtml(attendeeIds)}
        </div>`;
    }
    const marker = L.marker([p.lat, p.lng], {icon}).bindPopup(popupHtml);
    layerGroups[p.category].addLayer(marker);
    bounds.push([p.lat, p.lng]);
  });

  Object.values(layerGroups).forEach(lg => lg.addTo(map));
  generalMapInstance = map;
  generalLayerGroups = layerGroups;

  if(bounds.length === 1) map.setView(bounds[0], 14);
  else map.fitBounds(bounds, { padding:[24,24] });
}

function buildLeafletMap(el, lat, lng, color){
  color = color || '#EC1F86';
  el.textContent = '';
  el.style.background = 'none';
  const map = L.map(el, { zoomControl:false, scrollWheelZoom:false }).setView([lat, lng], 15);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
    attribution: '© OpenStreetMap, © CARTO',
    maxZoom: 19,
    subdomains: 'abcd'
  }).addTo(map);
  const icon = L.divIcon({
    className: 'croquis-pin',
    html: `<div style="width:14px;height:14px;border-radius:50%;background:${color};border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.35);"></div>`,
    iconSize: [14,14],
    iconAnchor: [7,7]
  });
  L.marker([lat, lng], {icon}).addTo(map);
}

function extractMapQuery(input){
  if(!input) return null;
  const s = input.trim();
  if(!looksLikeUrl(s)) return s;
  if(isShortLink(s)) return null;
  try{
    let m = s.match(/@(-?\d+\.\d+),(-?\d+\.\d+)/);
    if(m) return `${m[1]},${m[2]}`;
    m = s.match(/!3d(-?\d+\.\d+)!4d(-?\d+\.\d+)/);
    if(m) return `${m[1]},${m[2]}`;
    m = s.match(/\/place\/([^\/@]+)/);
    if(m) return decodeURIComponent(m[1].replace(/\+/g,' '));
    m = s.match(/[?&]q=([^&]+)/);
    if(m) return decodeURIComponent(m[1].replace(/\+/g,' '));
    return null;
  }catch(e){ return null; }
}

function mapsBlockHtml(rawValue, color){

    html += `
      <div style="font-size:12px;color:var(--muted);margin-top:8px;">
        Es un link corto y no trae la ubicación exacta en la URL, así que no podemos generar la miniatura directo.
        <div style="margin-top:8px;"><button type="button" class="btn small secondary" onclick="window.open('${safe}','_blank')">Abrir para copiar el link completo</button></div>
        <div style="margin-top:8px;">Se abre el mapa en una pestaña nueva — copia la URL completa de la barra de direcciones (la que empieza con google.com/maps/place/...) y pégala aquí en lugar del link corto.</div>
      </div>`;
  } else if(isUrl){
    html += `<div style="font-size:12px;color:var(--muted);margin-top:8px;">No se pudo generar la miniatura con este link. Prueba con la URL completa (con coordenadas o nombre del lugar) o escribe la dirección directamente.</div>`;
  }
  html += '</div>';
  return html;
}

    <div class="section-title">Editando</div>
    <input type="text" id="editGuestName-${g.id}" value="${esc(g.name)}" placeholder="Nombre" style="width:100%;margin-bottom:14px;">
    <div style="display:flex;align-items:center;border:1px solid var(--ink);margin-bottom:14px;">
      <span style="padding:0 0 0 10px;color:var(--muted);">${ICON_INSTAGRAM}</span>
      <span style="padding:8px 4px 8px 6px;color:var(--muted);">@</span>
      <input type="text" id="editInstagram-${g.id}" value="${esc(g.instagram||'')}" placeholder="usuario" style="flex:1;border:none;padding-left:0;">
    </div>
    <div class="lodging-fields">
      <div>
        <label>Fecha de llegada</label>
        <input type="date" id="editArrivalDate-${g.id}" value="${esc(l.arrivalDate||'')}" style="width:100%;">
      </div>
      <div>
        <label>Hora de llegada</label>
        <input type="time" id="editArrivalTime-${g.id}" value="${esc(l.arrivalTime||'')}" style="width:100%;">
      </div>
    </div>
    <div class="lodging-fields" style="margin-top:10px;">
      <div>
        <label>Fecha de salida</label>
        <input type="date" id="editDepartureDate-${g.id}" value="${esc(l.departureDate||'')}" style="width:100%;">
      </div>
      <div>
        <label>Hora de salida</label>
        <input type="time" id="editDepartureTime-${g.id}" value="${esc(l.departureTime||'')}" style="width:100%;">
      </div>
    </div>
    <input type="text" id="editPlaceName-${g.id}" value="${esc(l.placeName||'')}" placeholder="Nombre del hospedaje (opcional)" style="width:100%;margin:14px 0 10px;">
    <input type="text" id="editMapsLink-${g.id}" value="${esc(l.mapsLink||'')}" placeholder="Dirección o link de Google Maps" style="width:100%;margin-bottom:14px;">
    <div class="row-start">
      <button class="btn small" data-action="save-guest" data-id="${g.id}">Guardar</button>
      <button class="btn small secondary" data-action="cancel-guest" data-id="${g.id}">Cancelar</button>
    </div>
  </div>`;
}

function renderInvitados(){
  let html = `<div class="section-title">Invitados (${state.guests.length})</div>`;
  if(state.guests.length === 0){
    html += `<div class="empty">Sin invitados todavía.</div>`;
  }
  state.guests.forEach(g=>{
    if(editingItem.guest === g.id){
      html += renderGuestEditForm(g);
      return;
    }
    const isOpen = expandedIds.has(g.id);
    const color = avatarColor(g.id);
    const l = state.lodging[g.id] || {};
    html += `<div class="card">
      <button class="event-chip-toggle" data-action="toggle-expand" data-id="${g.id}" style="${isOpen ? `background:${color};color:#fff;border-color:${color};` : `background:var(--paper);color:var(--ink);border-color:var(--ink);`}">${esc(g.name)}${g.id===myGuestId ? ' · TÚ' : ''}</button>`;
    if(isOpen){
      const arrivalParts = [];
      if(l.arrivalDate) arrivalParts.push(formatDateLabel(l.arrivalDate) + (l.arrivalTime ? ' · ' + l.arrivalTime : ''));
      const departureParts = [];
      if(l.departureDate) departureParts.push(formatDateLabel(l.departureDate) + (l.departureTime ? ' · ' + l.departureTime : ''));
      html += `
      <div class="event-body">
        ${g.instagram ? `<div class="event-meta" style="display:flex;align-items:center;gap:6px;text-transform:none;letter-spacing:0;"><span>${ICON_INSTAGRAM}</span> <a href="https://instagram.com/${esc(g.instagram.trim().replace(/^[@.\u00B7\u2022\s]+/,''))}" target="_blank" rel="noopener" style="color:var(--ink);text-decoration:underline;">@${esc(g.instagram.trim().replace(/^[@.\u00B7\u2022\s]+/,''))}</a></div>` : ''}
        ${arrivalParts.length ? `<div class="event-meta">Llega: ${esc(arrivalParts[0])}</div>` : ''}
        ${departureParts.length ? `<div class="event-meta">Sale: ${esc(departureParts[0])}</div>` : ''}
        ${l.placeName ? `<div class="event-notes">${esc(l.placeName)}</div>` : ''}
        ${mapsBlockHtml(l.mapsLink, color)}
        <div class="row-start" style="margin-top:14px;">
          <button class="arrow-link" data-action="edit-guest" data-id="${g.id}" style="text-transform:none;">Editar</button>
          <button class="arrow-link" data-action="delete-guest" data-guest="${g.id}" style="text-transform:none;">Eliminar</button>
        </div>
      </div>`;
    }
    html += `</div>`;
  });
  html += `
  <div class="add-card">
    <div class="row-start">
      <input type="text" id="newGuestName" placeholder="Nombre del invitado" style="flex:1;">
      <button class="btn" data-action="add-guest">Agregar</button>
    </div>
  </div>`;
  return html;
}

// ---------- handlers ----------

function attachHandlers(){
  document.querySelectorAll('[data-action]').forEach(el=>{
    if(el.dataset.bound) return;
    el.dataset.bound = '1';
    el.addEventListener('click', onAction);
  });
  document.querySelectorAll('input[type="date"], input[type="time"]').forEach(el=>{
    if(el.dataset.boundFocus) return;
    el.dataset.boundFocus = '1';
    el.addEventListener('focus', ()=>{ suppressRender = true; });
    el.addEventListener('blur', ()=>{
      suppressRender = false;
      if(pendingRender){ pendingRender = false; render(); }
    });
  });
}

async function onAction(e){
  const el = e.currentTarget;
  const action = el.dataset.action;

  if(action === 'add-item'){
    const listKey = el.dataset.list;
    const name = document.getElementById('itemName').value.trim();
    if(!name) return showToast('Escribe un nombre');
    state[listKey].push({
      id: genId(),
      name,
      location: document.getElementById('itemLoc').value.trim(),
      date: document.getElementById('itemDate').value,
      time: document.getElementById('itemTime').value,
      notes: document.getElementById('itemNotes').value.trim()
    });
    await persist(); render(); showToast('Agregado');
  }
  else if(action === 'delete-item'){
    const listKey = el.dataset.list, id = el.dataset.id;
    if(!confirm('¿Eliminar esto?')) return;
    state[listKey] = state[listKey].filter(x=>x.id!==id);
    delete state.rsvps[id];
    if(listKey === 'events'){ state.expenses = state.expenses.filter(ex=>ex.eventId!==id); }
    await persist(); render();
  }
  else if(action === 'toggle-layer'){
    const layer = el.dataset.layer;
    if(!generalMapInstance || !generalLayerGroups[layer]) return;
    if(el.checked){ generalMapInstance.addLayer(generalLayerGroups[layer]); }
    else { generalMapInstance.removeLayer(generalLayerGroups[layer]); }
  }
  else if(action === 'toggle-expand'){
    const id = el.dataset.id;
    if(expandedIds.has(id)) expandedIds.delete(id); else expandedIds.add(id);
    render();
  }
  else if(action === 'edit-item'){
    editingItem[el.dataset.list] = el.dataset.id;
    render();
  }
  else if(action === 'cancel-item'){
    editingItem[el.dataset.list] = null;
    render();
  }
  else if(action === 'save-item'){
    const listKey = el.dataset.list, id = el.dataset.id;
    const item = state[listKey].find(x=>x.id===id);
    if(item){
      const newName = document.getElementById(`editName-${id}`).value.trim();
      item.name = newName || item.name;
      item.location = document.getElementById(`editLoc-${id}`).value.trim();
      item.date = document.getElementById(`editDate-${id}`).value;
      item.time = document.getElementById(`editTime-${id}`).value;
      item.notes = document.getElementById(`editNotes-${id}`).value.trim();
    }
    editingItem[listKey] = null;
    await persist(); render(); showToast('Guardado');
  }
  else if(action === 'toggle-rsvp'){
    if(!myGuestId) return showToast('Elige tu nombre arriba primero');
    const id = el.dataset.event;
    if(!state.rsvps[id]) state.rsvps[id] = {};
    state.rsvps[id][myGuestId] = !state.rsvps[id][myGuestId];
    await persist(); render();
  }
  else if(action === 'add-guest'){
    const input = document.getElementById('newGuestName');
    const name = input.value.trim();
    if(!name) return showToast('Escribe un nombre');
    state.guests.push({id: genId(), name});
    await persist(); render(); showToast('Invitado agregado');
  }
  else if(action === 'edit-guest'){
    editingItem.guest = el.dataset.id;
    render();
  }
  else if(action === 'cancel-guest'){
    editingItem.guest = null;
    render();
  }
  else if(action === 'save-guest'){
    const id = el.dataset.id;
    const g = state.guests.find(x=>x.id===id);
    const newName = document.getElementById(`editGuestName-${id}`).value.trim();
    if(!newName) return showToast('El nombre no puede quedar vacío');
    if(g) g.name = newName;
    if(g) g.instagram = document.getElementById(`editInstagram-${id}`).value.trim().replace(/^[@.\u00B7\u2022\s]+/, '');
    if(!state.lodging[id]) state.lodging[id] = {};
    state.lodging[id].arrivalDate = document.getElementById(`editArrivalDate-${id}`).value;
    state.lodging[id].arrivalTime = document.getElementById(`editArrivalTime-${id}`).value;
    state.lodging[id].departureDate = document.getElementById(`editDepartureDate-${id}`).value;
    state.lodging[id].departureTime = document.getElementById(`editDepartureTime-${id}`).value;
    state.lodging[id].placeName = document.getElementById(`editPlaceName-${id}`).value.trim();
    state.lodging[id].mapsLink = document.getElementById(`editMapsLink-${id}`).value.trim();
    editingItem.guest = null;
    await persist(); render(); showToast('Guardado');
  }
  else if(action === 'delete-guest'){
    if(!confirm('¿Eliminar a este invitado?')) return;
    const id = el.dataset.guest;
    state.guests = state.guests.filter(g=>g.id!==id);
    Object.keys(state.rsvps).forEach(itemId=> delete state.rsvps[itemId][id]);
    state.expenses.forEach(ex=>{ ex.splitAmong = ex.splitAmong.filter(g=>g!==id); });
    delete state.lodging[id];
    expandedIds.delete(id);
    if(myGuestId === id) setMyGuestId(null);
    await persist(); render();
  }
  else if(action === 'save-link'){
    const field = el.dataset.field;
    const val = document.getElementById(`link-${field}`).value.trim();
    if(!state.links) state.links = {};
    state.links[field] = val;
    editingLinks.delete(field);
    await persist(); render(); showToast('Guardado');
  }
  else if(action === 'edit-link'){
    editingLinks.add(el.dataset.field);
    render();
  }
  else if(action === 'cancel-link'){
    editingLinks.delete(el.dataset.field);
    render();
  }
  else if(action === 'add-expense'){
    const evId = el.dataset.event;
    const desc = document.getElementById(`exDesc-${evId}`).value.trim();
    const amt = parseFloat(document.getElementById(`exAmt-${evId}`).value);
    const paidBy = document.getElementById(`exPaidBy-${evId}`).value;
    const among = Array.from(document.querySelectorAll(`.split-${evId}:checked`)).map(c=>c.value);
    if(!desc || !amt || amt<=0) return showToast('Falta descripción o monto');
    if(!paidBy) return showToast('Selecciona quién pagó');
    if(among.length===0) return showToast('Selecciona entre quién dividir');
    state.expenses.push({id: genId(), eventId: evId, desc, amount: amt, paidBy, splitAmong: among});
    await persist(); render(); showToast('Gasto agregado');
  }
  else if(action === 'delete-expense'){
    const id = el.dataset.expense;
    state.expenses = state.expenses.filter(ex=>ex.id!==id);
    await persist(); render();
  }
}

document.querySelectorAll('.tab').forEach(t=>{
  t.addEventListener('click', ()=>{
    document.querySelectorAll('.tab').forEach(x=>x.classList.remove('active'));
    t.classList.add('active');
    activeTab = t.dataset.tab;
    render();
  });
});

document.getElementById('whoSelect').addEventListener('change', (e)=>{
  setMyGuestId(e.target.value || null);
});

loadAll();
</script>
